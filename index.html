<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinf Qatorlari Bo'yicha Telefon Tekshiruvi</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0b1120; color: #f8fafc; margin: 0; padding: 15px; }
        .container { max-width: 800px; margin: auto; }
        .header { background: #1e293b; padding: 18px; border-radius: 12px; margin-bottom: 15px; text-align: center; }
        .row-tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 12px; border: 2px solid #334155; background: #1e293b; color: #cbd5e1; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 15px; }
        .tab-btn.active { border-color: #38bdf8; background: #0284c7; color: white; }
        .btn-group { display: flex; gap: 10px; justify-content: center; margin-bottom: 15px; flex-wrap: wrap; }
        .btn { background: #3b82f6; color: white; border: none; padding: 14px 22px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 15px; }
        .btn-capture { background: #ef4444; font-size: 16px; }
        .btn:disabled { background: #475569; cursor: not-allowed; }
        .camera-box { background: #1e293b; padding: 12px; border-radius: 12px; text-align: center; border: 1px solid #334155; }
        .media-wrap { position: relative; display: inline-block; max-width: 100%; }
        video, canvas { border-radius: 8px; max-width: 100%; height: auto; display: block; margin: auto; }
        .result-banner { padding: 15px; border-radius: 10px; font-weight: bold; font-size: 17px; margin-top: 12px; display: none; }
        .res-red { background: rgba(239, 68, 68, 0.2); border: 2px solid #ef4444; color: #fca5a5; }
        .res-green { background: rgba(16, 185, 129, 0.2); border: 2px solid #10b981; color: #6ee7b7; }
        .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
        .sum-card { background: #1e293b; padding: 12px; border-radius: 10px; text-align: center; border: 1px solid #334155; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2 style="margin:0 0 6px 0;">📸 Sinf Qatorlari Bo'yicha AI Tekshiruv</h2>
        <div id="status" style="color:#facc15; font-size:14px;">⏳ AI modeli yuklanmoqda...</div>
    </div>

    <!-- 3 ta qatorni tanlash -->
    <div class="row-tabs">
        <button class="tab-btn active" onclick="selectRow(1, this)">1-Qator</button>
        <button class="tab-btn" onclick="selectRow(2, this)">2-Qator</button>
        <button class="tab-btn" onclick="selectRow(3, this)">3-Qator</button>
    </div>

    <div class="btn-group">
        <button id="camBtn" class="btn" onclick="openCamera()" disabled>📷 Kamerani Ochish</button>
        <button id="snapBtn" class="btn btn-capture" onclick="captureAndCheck()" style="display:none;">⚡ Rasmga Olish va Tekshirish</button>
        <button id="retakeBtn" class="btn" onclick="openCamera()" style="display:none; background:#64748b;">🔄 Qayta Rasmga Olish</button>
    </div>

    <div class="camera-box">
        <div class="media-wrap">
            <video id="video" autoplay muted playsinline style="display:none;"></video>
            <canvas id="resultCanvas" style="display:none;"></canvas>
        </div>
        <div id="resultBanner" class="result-banner"></div>
    </div>

    <!-- 3 ta qatorning umumiy hisobi -->
    <div class="summary">
        <div class="sum-card">
            <div style="font-size:12px; color:#94a3b8;">1-QATOR</div>
            <div id="r1" style="font-size:20px; font-weight:bold; margin-top:4px;">—</div>
        </div>
        <div class="sum-card">
            <div style="font-size:12px; color:#94a3b8;">2-QATOR</div>
            <div id="r2" style="font-size:20px; font-weight:bold; margin-top:4px;">—</div>
        </div>
        <div class="sum-card">
            <div style="font-size:12px; color:#94a3b8;">3-QATOR</div>
            <div id="r3" style="font-size:20px; font-weight:bold; margin-top:4px;">—</div>
        </div>
    </div>
</div>

<script>
    let model = null;
    let currentRow = 1;
    let stream = null;
    const video = document.getElementById('video');
    const canvas = document.getElementById('resultCanvas');
    const ctx = canvas.getContext('2d');

    const TARGETS = {
        'cell phone': 'Telefon',
        'tv': 'Monitor / TV',
        'laptop': 'Noutbuk',
        'remote': 'Telefon / Pult'
    };

    // AI modelini yuklash
    cocoSsd.load({ base: 'mobilenet_v2' }).then(m => {
        model = m;
        document.getElementById('status').innerText = "✅ AI tayyor! Qatorni tanlab kamerani oching.";
        document.getElementById('status').style.color = "#10b981";
        document.getElementById('camBtn').disabled = false;
    });

    function selectRow(rowNum, btn) {
        currentRow = rowNum;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('resultBanner').style.display = 'none';
        openCamera();
    }

    async function openCamera() {
        document.getElementById('resultBanner').style.display = 'none';
        canvas.style.display = 'none';
        document.getElementById('retakeBtn').style.display = 'none';

        try {
            if (!stream) {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
            }
            video.srcObject = stream;
            video.style.display = 'block';
            document.getElementById('camBtn').style.display = 'none';
            document.getElementById('snapBtn').style.display = 'inline-block';
        } catch (err) {
            alert("Kameraga ruxsat berilmadi: " + err.message);
        }
    }

    async function captureAndCheck() {
        if (!model || video.readyState < 2) return;

        // Video kadrini to'liq sifatda rasmga muhrlash
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        video.style.display = 'none';
        canvas.style.display = 'block';
        document.getElementById('snapBtn').style.display = 'none';
        document.getElementById('retakeBtn').style.display = 'inline-block';

        const banner = document.getElementById('resultBanner');
        banner.style.display = 'block';
        banner.className = 'result-banner';
        banner.style.color = '#facc15';
        banner.innerText = "⏳ AI rasmni tekshirmoqda...";

        // AI tahlili (sezgirlik 0.25 ga tushirildi — uzoq va yon tomondagi telefonlarni ham ushlaydi)
        const predictions = await model.detect(canvas, 20, 0.25);
        let foundDevices = [];

        predictions.forEach(pred => {
            if (TARGETS[pred.class]) {
                const [x, y, w, h] = pred.bbox;
                foundDevices.push(pred);

                // QIZIL RAMKA — Telefon/qurilma bor!
                ctx.lineWidth = 4;
                ctx.strokeStyle = '#ef4444';
                ctx.strokeRect(x, y, w, h);

                ctx.fillStyle = '#ef4444';
                ctx.fillRect(x, y > 28 ? y - 28 : y, w, 28);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 16px sans-serif';
                ctx.fillText(`🔴 ${TARGETS[pred.class]} (${Math.round(pred.score * 100)}%)`, x + 6, y > 28 ? y - 8 : y + 20);
            }
        });

        const rowCell = document.getElementById(`r${currentRow}`);

        if (foundDevices.length > 0) {
            banner.className = 'result-banner res-red';
            banner.innerText = `🔴 ${currentRow}-qatorda ${foundDevices.length} ta telefon/qurilma BOR!`;
            rowCell.innerText = `🔴 ${foundDevices.length} ta bor`;
            rowCell.style.color = '#ef4444';
        } else {
            // YASHIL RAMKA — Butun rasm atrofiga yashil chiziq (Toza!)
            ctx.lineWidth = 8;
            ctx.strokeStyle = '#10b981';
            ctx.strokeRect(4, 4, canvas.width - 8, canvas.height - 8);

            banner.className = 'result-banner res-green';
            banner.innerText = `🟢 ${currentRow}-qator TOZA! Telefon topilmadi.`;
            rowCell.innerText = `🟢 Yo'q`;
            rowCell.style.color = '#10b981';
        }
    }
</script>
</body>
</html>
